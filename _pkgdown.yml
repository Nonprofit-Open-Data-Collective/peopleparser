url: https://nonprofit-open-data-collective.github.io/peopleparser/
destination: docs

# The site style (colours, fonts, navbar, light/dark switch) comes from the
# pkgstyle template package (github.com/Nonprofit-Open-Data-Collective/pkgstyle).
template:
  package: pkgstyle

home:
  title: "peopleparser: parse raw person names"

navbar:
  structure:
    left: [intro, guides, reference, news]
  components:
    guides:
      text: Guides
      menu:
      - text: Canonical first names, nicknames and gender
        href: articles/canonical-first-names.html

articles:
- title: Guides
  navbar: ~
  contents:
  - canonical-first-names

reference:
- title: Parse names
  desc: Top-level entry points for turning raw names into structured components.
  contents:
  - parse_name
  - parse_names

- title: Prepare & clean
  desc: Sanitize and normalize raw name strings before parsing.
  contents:
  - sanitize_input
  - prep_name
  - de_clutter
  - trim_spaces
  - remove_punctuation
  - fix_locative_surnames
  - remove_elements
  - extract_component

- title: Census-based inference
  desc: Resolve name ordering, surnames, and gender from census frequencies.
  contents:
  - get_census_data
  - check_if_surname
  - determine_gender
  - determine_surname
  - assign_names
  - resolve_middle_name

- title: Nicknames and canonical first names
  desc: Formal names, nicknames, spelling variants and one canonical form per first name.
  contents:
  - nickname_lookup
  - canonical_first_name
  - first_name_variants
  - get_formal_names
  - get_nicknames
  - first_name_pairs

- title: Reference data
  desc: Bundled datasets and lookup tables.
  contents:
  - census.names
  - known_titles
  - prx
  - sfx
  - names_100
  - names_1000
  - get_example_names
